<section class="about-section">
  <div class="about-container">

    <header class="section-header">
      <span class="section-label">Expertise</span>
      <h2 class="section-title">Skills & Technologies</h2>
    </header>

    <div class="tech-grid">
      @for (card of cards; track card.name) {
        <div class="tech-card">
          <div class="icon-circle" [style.background]="card.iconBg">

            @if (card.icon === 'java') {
              <svg viewBox="0 0 48 48" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.2 35.5s-1.9 1.1.7 1.5c3.1.5 4.7.4 8.1-.4 0 0 .9.6 2.2 1.1-7.8 3.3-17.6-.2-11-2.2z" fill="#e85d3f"/>
                <path d="M18.1 30.7s-2.1 1.6.7 1.9c2.4.3 6.1.3 9.7-.1 0 0 .6.6 1.6.9-8.6 2.5-18.2.2-12-.7z" fill="#e85d3f" opacity=".85"/>
                <path d="M24.3 22.4c1.8 2-4.7 3.8-4.7 3.8s11.1-1.4 8.2-6.3c-2.7-4.5-4.8-6.7 6.5-14.4C34.3 5.5 19.4 9.4 24.3 22.4z" fill="#e85d3f" opacity=".9"/>
                <path d="M32.2 38.4s1.4 1.2-1.6 2.1c-5.6 1.7-23.4 2.2-28.3.1-1.8-.8 1.5-1.9 2.5-2.1 1.1-.2 1.7-.2 1.7-.2-1.9-1.3-12.4 2.7-5.3 3.8 19.3 3.1 35.2-1.4 31-3.7z" fill="#e85d3f"/>
                <path d="M20 26.8s-8.7 2.1-3.1 2.8c2.4.3 7.1.2 11.5-.1 3.6-.3 7.2-1 7.2-1s-1.3.5-2.2 1.1c-9 2.4-26.3 1.3-21.3-.7 4.2-1.7 7.9-2.1 7.9-2.1z" fill="#e85d3f" opacity=".8"/>
                <path d="M29.7 33.6c9.1-4.7 4.9-9.3 1.9-8.7-.7.1-1 .3-1 .3s.3-.4.8-.6c6-2.1 10.6 6.3-1.9 9.6 0 0 .2-.1.2-.6z" fill="#e85d3f" opacity=".9"/>
                <path d="M26.5 4s5 5-4.7 12.7c-7.7 6.1-1.7 9.6 0 13.5-4.5-4-7.7-7.6-5.5-10.9C19.7 15 29.4 12.5 26.5 4z" fill="#e85d3f"/>
              </svg>
            }

            @if (card.icon === 'spring') {
              <svg viewBox="0 0 48 48" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="18" fill="#22c55e"/>
                <path d="M24 14v10l7 4" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <circle cx="24" cy="24" r="4" fill="white"/>
              </svg>
            }

            @if (card.icon === 'angular') {
              <svg viewBox="0 0 48 48" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
                <polygon points="24,4 42,10 39,34 24,44 9,34 6,10" fill="#dd1b16"/>
                <polygon points="24,4 24,44 9,34 6,10" fill="#c2185b" opacity="0.3"/>
                <polygon points="24,10 32,32 28,32 25.5,25 22.5,25 20,32 16,32" fill="white"/>
                <rect x="18" y="22" width="12" height="2.5" fill="white"/>
              </svg>
            }

            @if (card.icon === 'dsa') {
              <svg viewBox="0 0 48 48" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="30" width="7" height="12" rx="1.5" fill="#2f5fad"/>
                <rect x="16" y="22" width="7" height="20" rx="1.5" fill="#2f5fad" opacity=".85"/>
                <rect x="26" y="14" width="7" height="28" rx="1.5" fill="#2f5fad" opacity=".7"/>
                <rect x="36" y="6" width="7" height="36" rx="1.5" fill="#2f5fad" opacity=".55"/>
                <path d="M9 28 L19 20 L29 12 L39 6" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }

            @if (card.icon === 'docker') {
              <svg viewBox="0 0 48 48" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="18" width="7" height="6" rx="1" fill="#0ea5e9"/>
                <rect x="14" y="18" width="7" height="6" rx="1" fill="#0ea5e9"/>
                <rect x="22" y="18" width="7" height="6" rx="1" fill="#0ea5e9"/>
                <rect x="14" y="11" width="7" height="6" rx="1" fill="#0ea5e9" opacity=".75"/>
                <rect x="22" y="11" width="7" height="6" rx="1" fill="#0ea5e9" opacity=".75"/>
                <path d="M6 25c0 0 1-1 4 0s8 3 14 0 10-1 16 1c0 4-3 9-10 9H14C9 35 6 30 6 25z" fill="#0ea5e9" opacity=".9"/>
                <circle cx="38" cy="21" r="3" fill="#0ea5e9"/>
                <path d="M38 18v-2" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            }

          </div>

          <span class="tech-name">{{ card.name }}</span>
          <span class="tech-sub">{{ card.subtitle }}</span>
        </div>
      }
    </div>

  </div>
</section>
